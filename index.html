<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro Animations</title>
    <meta
      name="description"
      content="A collection of small animated logos, icons and buttons."
    />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Micro Animations</h1>
        <p>
          A collection of small animated logos, icons and buttons.
        </p>
        <a
          class="codepen-link"
          href="https://codepen.io/charlesduquette"
          target="_blank"
          rel="noopener"
          >See the code on CodePen &rarr;</a
        >
      </header>

      <ul class="grid">
        <li>
          <a class="card" href="logos/submit-button/index.html">
            <img
              src="logos/submit-button/thumb.png"
              alt="submit-button"
              loading="lazy"
            />
            <span class="caption">submit-button</span>
          </a>
        </li>
        <li>
          <a class="card" href="logos/iag/index.html">
            <img src="logos/iag/thumb.png" alt="iag" loading="lazy" />
            <span class="caption">iag</span>
          </a>
        </li>
        <li>
          <a class="card" href="logos/js/index.html">
            <img src="logos/js/thumb.png" alt="js" loading="lazy" />
            <span class="caption">js</span>
          </a>
        </li>
        <li>
          <a class="card" href="logos/react/index.html">
            <img src="logos/react/thumb.png" alt="react" loading="lazy" />
            <span class="caption">react</span>
          </a>
        </li>
        <li>
          <a class="card" href="logos/redux/index.html">
            <img src="logos/redux/thumb.png" alt="redux" loading="lazy" />
            <span class="caption">redux</span>
          </a>
        </li>
        <li>
          <a class="card" href="logos/beaker/index.html">
            <img src="logos/beaker/thumb.png" alt="beaker" loading="lazy" />
            <span class="caption">beaker</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
